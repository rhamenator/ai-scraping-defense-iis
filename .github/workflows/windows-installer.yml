name: windows-installer

on:
  push:
    branches:
      - main
      - codex/**
      - copilot/**
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.402

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Derive Installer Version
        id: version
        shell: pwsh
        run: |
          $prerelease = 'false'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # Exact SemVer grammar only; the tag is data, never shell source.
            $version = (python scripts/validate_release_version.py $env:GITHUB_REF_NAME)
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if (($version -split '\+')[0].Contains('-')) {
              $prerelease = 'true'
            }
          }
          else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Build Windows Installer
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_RUNTIME: ${{ matrix.runtime }}
        run: .\installer\Build-WindowsInstaller.ps1 -Version $env:INSTALLER_VERSION -Runtime $env:INSTALLER_RUNTIME

      - name: Generate Installer Checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts/installer/output/*.exe | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Installer executable was not produced.'
          }

          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant()) *$($installer.Name)" | Out-File -FilePath "artifacts/installer/output/$($installer.Name).sha256" -Encoding ascii

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-scraping-defense-windows-installer-${{ steps.version.outputs.version }}-${{ matrix.runtime }}
          path: |
            artifacts/installer/output/*.exe
            artifacts/installer/output/*.sha256
          if-no-files-found: error

  sign-installer:
    needs: build-installer
    if: github.ref_type == 'tag' && vars.SIGNING_ENABLED == 'true'
    environment: release-signing
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64

    steps:
      - name: Download Unsigned Installer Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-scraping-defense-windows-installer-${{ needs.build-installer.outputs.version }}-${{ matrix.runtime }}
          path: artifacts/installer/output

      - name: Verify Unsigned Installer Digest
        shell: pwsh
        run: |
          $checksumFiles = Get-ChildItem artifacts/installer/output/*.sha256
          if ($checksumFiles.Count -eq 0) {
            throw 'No checksum file found for downloaded installer.'
          }

          foreach ($checksumFile in $checksumFiles) {
            $line = (Get-Content $checksumFile.FullName -Raw).Trim()
            $parts = $line -split '\s+\*?', 2
            if ($parts.Length -ne 2) {
              throw "Malformed checksum line in $($checksumFile.Name)."
            }

            $expectedHash = $parts[0].ToLowerInvariant()
            $targetPath = Join-Path 'artifacts/installer/output' $parts[1]
            if (-not (Test-Path $targetPath)) {
              throw "Missing installer referenced by $($checksumFile.Name): $targetPath"
            }

            $actualHash = (Get-FileHash $targetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Digest mismatch for $($parts[1]): expected $expectedHash, got $actualHash."
            }
          }

      - name: Import Windows Signing Certificate
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_PASSWORD)) {
            throw 'SIGNING_ENABLED is true, but WINDOWS_SIGN_CERT_BASE64 or WINDOWS_SIGN_CERT_PASSWORD is not configured.'
          }

          $certPath = Join-Path $env:RUNNER_TEMP 'windows-signing-cert.pfx'
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          "WINDOWS_SIGN_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Authenticode Sign Installer
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw 'signtool.exe was not found on the runner.'
          }

          $timestampUrl = if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_TIMESTAMP_URL)) {
            $env:WINDOWS_SIGN_TIMESTAMP_URL
          }
          else {
            'http://timestamp.digicert.com'
          }

          Get-ChildItem artifacts/installer/output/*.exe | ForEach-Object {
            & $signtool sign /fd SHA256 /f $env:WINDOWS_SIGN_CERT_PATH /p $env:WINDOWS_SIGN_CERT_PASSWORD /tr $timestampUrl /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe failed for $($_.Name)."
            }

            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant()) *$($_.Name)" | Out-File -FilePath "artifacts/installer/output/$($_.Name).sha256" -Encoding ascii
          }

      - name: Upload Signed Installer Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-scraping-defense-windows-installer-signed-${{ needs.build-installer.outputs.version }}-${{ matrix.runtime }}
          path: |
            artifacts/installer/output/*.exe
            artifacts/installer/output/*.sha256
          if-no-files-found: error

  publish-installer:
    needs: [build-installer, sign-installer]
    if: always() && github.ref_type == 'tag' && needs.build-installer.result == 'success' && (needs.sign-installer.result == 'success' || needs.sign-installer.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Signed Installer Artifacts
        if: vars.SIGNING_ENABLED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-scraping-defense-windows-installer-signed-${{ needs.build-installer.outputs.version }}-*
          merge-multiple: true
          path: release-assets

      - name: Download Unsigned Installer Artifacts
        if: vars.SIGNING_ENABLED != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-scraping-defense-windows-installer-${{ needs.build-installer.outputs.version }}-*
          merge-multiple: true
          path: release-assets

      - name: Verify Release Asset Digests
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c ./*.sha256

      - name: Publish Stable Installer To GitHub Release
        if: needs.build-installer.outputs.prerelease != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-assets/*.exe
            release-assets/*.sha256
          generate_release_notes: true
          make_latest: true

      - name: Publish Prerelease Installer To GitHub Release
        if: needs.build-installer.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-assets/*.exe
            release-assets/*.sha256
          generate_release_notes: true
          prerelease: true
          make_latest: false
