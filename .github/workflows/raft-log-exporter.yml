name: raft-log-exporter

# Builds the tool that exports a DotNext 5 Raft log for the DotNext 6 upgrade (docs/migrations.md) and attaches it to releases.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "tools/RaftLogExporter/**"
      - ".github/workflows/raft-log-exporter.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.402

      - name: Publish a self-contained single file
        run: >
          dotnet publish tools/RaftLogExporter/RaftLogExporter.csproj
          -c Release -r "${{ matrix.runtime }}" --self-contained
          -p:PublishSingleFile=true -p:DebugType=None
          -o "artifacts/exporter/${{ matrix.runtime }}"

      - name: Package and checksum
        run: |
          set -euo pipefail
          runtime="${{ matrix.runtime }}"
          mkdir -p artifacts/release
          cd "artifacts/exporter/${runtime}"
          if [[ "${runtime}" == win-* ]]; then
            zip -q "../../release/raft-log-exporter-${runtime}.zip" RaftLogExporter.exe
            archive="raft-log-exporter-${runtime}.zip"
          else
            tar -czf "../../release/raft-log-exporter-${runtime}.tar.gz" RaftLogExporter
            archive="raft-log-exporter-${runtime}.tar.gz"
          fi
          cd ../../release
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raft-log-exporter-${{ matrix.runtime }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/release/*
