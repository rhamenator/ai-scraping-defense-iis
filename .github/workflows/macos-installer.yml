name: macos-installer

on:
  push:
    branches:
      - main
      - codex/**
      - copilot/**
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.104

      - name: Derive Installer Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "${version}" == *-* ]]; then
              prerelease=true
            fi
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Build macOS Packages
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: ./installer/macos/build-macos-packages.sh "${{ steps.version.outputs.version }}"

      - name: Install and smoke test package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find artifacts/macos-installer/output -maxdepth 1 -name '*-${{ matrix.runtime }}.pkg' -print -quit)"
          if [[ -z "${package}" ]]; then
            echo "The ${{ matrix.runtime }} package was not produced." >&2
            exit 1
          fi

          sudo installer -pkg "${package}" -target /

          install_root="/usr/local/lib/ai-scraping-defense/${{ matrix.runtime }}"
          executable="${install_root}/AiScrapingDefense.EdgeGateway"
          test -x "${executable}"
          mkdir -p "$RUNNER_TEMP/tarpit-archives"

          ASPNETCORE_URLS=http://127.0.0.1:18080 \
          DOTNET_ENVIRONMENT=Development \
          DefenseEngine__Management__ApiKey=installer-smoke-management-key \
          DefenseEngine__Intake__ApiKey=installer-smoke-intake-key \
          DefenseEngine__Audit__DatabasePath="$RUNNER_TEMP/defense-events.db" \
          DefenseEngine__Tarpit__ArchiveDirectory="$RUNNER_TEMP/tarpit-archives" \
          "${executable}" --contentRoot "${install_root}" > "$RUNNER_TEMP/installer-smoke.log" 2>&1 &
          service_pid=$!
          trap 'kill "${service_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..40}; do
            # A degraded response is expected without Redis on the packaging
            # runner; any HTTP response proves the installed service started.
            if curl --silent --output /dev/null http://127.0.0.1:18080/health; then
              exit 0
            fi
            if ! kill -0 "${service_pid}" 2>/dev/null; then
              cat "$RUNNER_TEMP/installer-smoke.log" >&2
              exit 1
            fi
            sleep 0.5
          done

          cat "$RUNNER_TEMP/installer-smoke.log" >&2
          echo "Installed edge gateway did not become healthy." >&2
          exit 1

      - name: Import Apple Installer Certificate
        shell: bash
        env:
          MACOS_INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_INSTALLER_CERT_BASE64}" || -z "${MACOS_INSTALLER_CERT_PASSWORD}" || -z "${MACOS_INSTALLER_SIGN_IDENTITY}" ]]; then
            echo "Skipping macOS signing certificate import."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/ai-scraping-defense-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/macos-installer-cert.p12"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-$GITHUB_RUN_ID}"
          echo "${MACOS_INSTALLER_CERT_BASE64}" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign macOS Packages
        shell: bash
        env:
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_SIGNING_KEYCHAIN:-}" || -z "${MACOS_INSTALLER_SIGN_IDENTITY}" ]]; then
            echo "Skipping macOS package signing."
            exit 0
          fi

          shopt -s nullglob
          for pkg in artifacts/macos-installer/output/*.pkg; do
            signed_pkg="${pkg%.pkg}-signed.pkg"
            productsign --keychain "$MACOS_SIGNING_KEYCHAIN" --sign "$MACOS_INSTALLER_SIGN_IDENTITY" "$pkg" "$signed_pkg"
            mv "$signed_pkg" "$pkg"
            shasum -a 256 "$pkg" | awk '{ print tolower($1) " *" $2 }' > "$pkg.sha256"
          done

      - name: Upload macOS Installer Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-scraping-defense-macos-installer-${{ steps.version.outputs.version }}-${{ matrix.runtime }}
          path: |
            artifacts/macos-installer/output/*.pkg
            artifacts/macos-installer/output/*.sha256
          if-no-files-found: error

      - name: Publish Stable macOS Installers To GitHub Release
        if: github.ref_type == 'tag' && steps.version.outputs.prerelease != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/macos-installer/output/*.pkg
            artifacts/macos-installer/output/*.sha256
          generate_release_notes: true
          make_latest: true

      - name: Publish Prerelease macOS Installers To GitHub Release
        if: github.ref_type == 'tag' && steps.version.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/macos-installer/output/*.pkg
            artifacts/macos-installer/output/*.sha256
          generate_release_notes: true
          prerelease: true
          make_latest: false
