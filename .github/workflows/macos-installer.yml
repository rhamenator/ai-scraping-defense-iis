name: macos-installer

on:
  push:
    branches:
      - main
      - codex/**
      - copilot/**
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.402

      - name: Derive Installer Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Exact SemVer grammar only; the tag is data, never shell source.
            version="$(python3 scripts/validate_release_version.py "${GITHUB_REF_NAME}")"
            core="${version%%+*}"
            if [[ "${core}" == *-* ]]; then
              prerelease=true
            fi
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Build macOS Packages
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          INSTALLER_VERSION: ${{ steps.version.outputs.version }}
        run: ./installer/macos/build-macos-packages.sh "${INSTALLER_VERSION}"

      - name: Install and smoke test package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find artifacts/macos-installer/output -maxdepth 1 -name '*-${{ matrix.runtime }}.pkg' -print -quit)"
          if [[ -z "${package}" ]]; then
            echo "The ${{ matrix.runtime }} package was not produced." >&2
            exit 1
          fi

          sudo installer -pkg "${package}" -target /

          install_root="/usr/local/lib/ai-scraping-defense/${{ matrix.runtime }}"
          executable="${install_root}/AiScrapingDefense.EdgeGateway"
          test -x "${executable}"
          mkdir -p "$RUNNER_TEMP/tarpit-archives"

          ASPNETCORE_URLS=http://127.0.0.1:18080 \
          DOTNET_ENVIRONMENT=Development \
          DefenseEngine__Management__ApiKey=installer-smoke-management-key \
          DefenseEngine__Intake__ApiKey=installer-smoke-intake-key \
          DefenseEngine__Audit__DatabasePath="$RUNNER_TEMP/defense-events.db" \
          DefenseEngine__Tarpit__ArchiveDirectory="$RUNNER_TEMP/tarpit-archives" \
          "${executable}" --contentRoot "${install_root}" > "$RUNNER_TEMP/installer-smoke.log" 2>&1 &
          service_pid=$!
          trap 'kill "${service_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..40}; do
            # A degraded response is expected without Redis on the packaging
            # runner; any HTTP response proves the installed service started.
            if curl --silent --output /dev/null http://127.0.0.1:18080/health; then
              exit 0
            fi
            if ! kill -0 "${service_pid}" 2>/dev/null; then
              cat "$RUNNER_TEMP/installer-smoke.log" >&2
              exit 1
            fi
            sleep 0.5
          done

          cat "$RUNNER_TEMP/installer-smoke.log" >&2
          echo "Installed edge gateway did not become healthy." >&2
          exit 1

      - name: Generate macOS Package Checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(artifacts/macos-installer/output/*.pkg)
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "No macOS packages produced." >&2
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            shasum -a 256 "$pkg" | awk -v name="$(basename "$pkg")" '{ print tolower($1) " *" name }' > "$pkg.sha256"
          done

      - name: Upload macOS Installer Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-scraping-defense-macos-installer-${{ steps.version.outputs.version }}-${{ matrix.runtime }}
          path: |
            artifacts/macos-installer/output/*.pkg
            artifacts/macos-installer/output/*.sha256
          if-no-files-found: error

  sign-installer:
    needs: build-installer
    if: github.ref_type == 'tag' && vars.SIGNING_ENABLED == 'true'
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Download Unsigned macOS Installer Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-scraping-defense-macos-installer-${{ needs.build-installer.outputs.version }}-${{ matrix.runtime }}
          path: artifacts/macos-installer/output

      - name: Verify Unsigned macOS Package Digests
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/macos-installer/output
          shasum -a 256 -c ./*.sha256

      - name: Import Apple Installer Certificate
        shell: bash
        env:
          MACOS_INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_INSTALLER_CERT_BASE64}" || -z "${MACOS_INSTALLER_CERT_PASSWORD}" || -z "${MACOS_INSTALLER_SIGN_IDENTITY}" ]]; then
            echo "SIGNING_ENABLED is true, but Apple signing secrets are not configured." >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/ai-scraping-defense-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/macos-installer-cert.p12"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-$GITHUB_RUN_ID}"
          echo "${MACOS_INSTALLER_CERT_BASE64}" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign macOS Packages
        shell: bash
        env:
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/macos-installer/output/*.pkg; do
            signed_pkg="${pkg%.pkg}-signed.pkg"
            productsign --keychain "$MACOS_SIGNING_KEYCHAIN" --sign "$MACOS_INSTALLER_SIGN_IDENTITY" "$pkg" "$signed_pkg"
            mv "$signed_pkg" "$pkg"
            shasum -a 256 "$pkg" | awk -v name="$(basename "$pkg")" '{ print tolower($1) " *" name }' > "$pkg.sha256"
          done

      - name: Upload Signed macOS Installer Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-scraping-defense-macos-installer-signed-${{ needs.build-installer.outputs.version }}-${{ matrix.runtime }}
          path: |
            artifacts/macos-installer/output/*.pkg
            artifacts/macos-installer/output/*.sha256
          if-no-files-found: error

  publish-installer:
    needs: [build-installer, sign-installer]
    if: always() && github.ref_type == 'tag' && needs.build-installer.result == 'success' && (needs.sign-installer.result == 'success' || needs.sign-installer.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Signed macOS Installer Artifacts
        if: vars.SIGNING_ENABLED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-scraping-defense-macos-installer-signed-${{ needs.build-installer.outputs.version }}-*
          merge-multiple: true
          path: release-assets

      - name: Download Unsigned macOS Installer Artifacts
        if: vars.SIGNING_ENABLED != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-scraping-defense-macos-installer-${{ needs.build-installer.outputs.version }}-*
          merge-multiple: true
          path: release-assets

      - name: Verify Release Asset Digests
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c ./*.sha256

      - name: Publish Stable macOS Installers To GitHub Release
        if: needs.build-installer.outputs.prerelease != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-assets/*.pkg
            release-assets/*.sha256
          generate_release_notes: true
          make_latest: true

      - name: Publish Prerelease macOS Installers To GitHub Release
        if: needs.build-installer.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-assets/*.pkg
            release-assets/*.sha256
          generate_release_notes: true
          prerelease: true
          make_latest: false
