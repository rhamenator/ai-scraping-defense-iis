name: dotnet-ci

on:
  push:
    branches:
      - main
      - codex/**
      - copilot/**
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.104

      - name: Restore
        run: dotnet restore anti-scraping-defense-iis.sln

      - name: Build
        run: dotnet build anti-scraping-defense-iis.sln --no-restore

      - name: Test
        run: dotnet test anti-scraping-defense-iis.sln --no-build

      - name: Validate Observability Compose Stack
        run: docker compose --env-file compose.env.example -f compose.yaml -f compose.observability.yaml config > /tmp/compose-observability.yml
