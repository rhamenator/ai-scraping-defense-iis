name: dotnet-ci

on:
  push:
    branches:
      - main
      - codex/**
      - copilot/**
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.402

      - name: Dashboard export tests
        run: node scripts/tests/test_dashboard_export.mjs

      - name: Release version grammar tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Restore
        run: dotnet restore anti-scraping-defense-iis.sln

      - name: Build
        run: dotnet build anti-scraping-defense-iis.sln --no-restore

      - name: Test
        run: dotnet test anti-scraping-defense-iis.sln --no-build

      - name: Observability stack refuses to start without a Grafana admin password
        run: |
          if docker compose --env-file compose.env.example -f compose.yaml -f compose.observability.yaml config > /dev/null 2>&1; then
            echo "Grafana must not start without GRAFANA_ADMIN_PASSWORD." >&2
            exit 1
          fi

      - name: Validate Observability Compose Stack
        env:
          GRAFANA_ADMIN_PASSWORD: config-validation-only
        run: |
          docker compose --env-file compose.env.example -f compose.yaml -f compose.observability.yaml config > /tmp/compose-observability.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/compose-observability.yml
