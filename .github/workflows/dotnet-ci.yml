name: dotnet-ci

on:
  push:
    branches:
      - main
      - codex/**
      - copilot/**
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.402

      - name: Dashboard export tests
        run: node scripts/tests/test_dashboard_export.mjs

      - name: Dashboard feedback tests
        run: node scripts/tests/test_dashboard_feedback.mjs

      - name: Release version grammar tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Restore
        run: dotnet restore anti-scraping-defense-iis.sln

      - name: Build
        run: dotnet build anti-scraping-defense-iis.sln --no-restore

      - name: Test
        run: dotnet test anti-scraping-defense-iis.sln --no-build

      - name: Observability stack refuses to start without a Grafana admin password
        run: |
          if docker compose --env-file compose.env.example -f compose.yaml -f compose.observability.yaml config > /dev/null 2>&1; then
            echo "Grafana must not start without GRAFANA_ADMIN_PASSWORD." >&2
            exit 1
          fi

      - name: Validate Observability Compose Stack
        env:
          GRAFANA_ADMIN_PASSWORD: config-validation-only
        run: |
          docker compose --env-file compose.env.example -f compose.yaml -f compose.observability.yaml config > /tmp/compose-observability.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/compose-observability.yml

      - name: Observability collector is loopback-only, bounded and valid
        env:
          GRAFANA_ADMIN_PASSWORD: config-validation-only
        run: |
          docker compose --env-file compose.env.example -f compose.yaml -f compose.observability.yaml config --format json > /tmp/compose-observability.json
          # Every published collector port is bound to loopback (the receiver has no authentication).
          jq -e '[.services["otel-collector"].ports[] | select(.host_ip != "127.0.0.1")] | length == 0' /tmp/compose-observability.json
          jq -e '.services["otel-collector"].ports | length >= 3' /tmp/compose-observability.json
          for config in otel-collector-config.yaml otel-collector-remote.example.yaml; do
            docker run --rm -v "$PWD/deploy/observability:/cfg:ro" -e OTEL_INGEST_TOKEN=config-validation-only \
              otel/opentelemetry-collector-contrib:0.111.0 validate --config="/cfg/$config"
          done
          # Prometheus has no authentication: loopback only, and no lifecycle API (it allows an unauthenticated /-/quit).
          jq -e '[.services.prometheus.ports[] | select(.host_ip != "127.0.0.1")] | length == 0' /tmp/compose-observability.json
          jq -e '.services.prometheus.ports | length >= 1' /tmp/compose-observability.json
          jq -e '[.services.prometheus.command[] | select(test("web.enable-lifecycle|web.enable-admin-api"))] | length == 0' /tmp/compose-observability.json
          # The memory limiter must come first in the pipeline and the receivers must bound request size.
          grep -q 'max_request_body_size' deploy/observability/otel-collector-config.yaml
          grep -q 'max_recv_msg_size_mib' deploy/observability/otel-collector-config.yaml
          awk '/processors:/ && ++n == 2 {f=1; next} f && /^ *- / {print $2; exit}' deploy/observability/otel-collector-config.yaml | grep -qx memory_limiter
