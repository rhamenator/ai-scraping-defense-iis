apiVersion: v1
kind: Namespace
metadata:
  name: ai-scraping-defense
---
apiVersion: v1
kind: Secret
metadata:
  name: defense-secrets
  namespace: ai-scraping-defense
type: Opaque
stringData:
  # Replace every value before applying this manifest outside an isolated lab.
  management-api-key: replace-with-a-random-management-key-of-at-least-32-chars
  split-service-token: replace-with-a-random-service-token-of-at-least-32-chars
  consensus-shared-secret: replace-with-a-random-consensus-secret-of-at-least-32-chars
  postgres-password: replace-with-a-random-postgres-password
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway-headless
  namespace: ai-scraping-defense
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: edge-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: raft
      port: 3262
      targetPort: raft
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway-public
  namespace: ai-scraping-defense
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: edge-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edge-gateway
  namespace: ai-scraping-defense
spec:
  serviceName: edge-gateway-headless
  replicas: 3
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
        app.kubernetes.io/part-of: ai-scraping-defense
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: edge-gateway
          image: ghcr.io/your-org/ai-scraping-defense-edge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: raft
              containerPort: 3262
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DefenseEngine__Redis__ConnectionString
              value: redis:6379
            - name: DefenseEngine__Topology__Mode
              value: Split
            - name: DefenseEngine__Topology__EscalationBaseUrl
              value: http://escalation-engine:8080
            - name: DefenseEngine__Topology__TarpitPublicBaseUrl
              value: https://tarpit.example.com
            - name: DefenseEngine__Topology__ServiceToken
              valueFrom:
                secretKeyRef:
                  name: defense-secrets
                  key: split-service-token
            - name: DefenseEngine__Management__ApiKey
              valueFrom:
                secretKeyRef:
                  name: defense-secrets
                  key: management-api-key
            - name: DefenseEngine__Audit__Provider
              value: Postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: defense-secrets
                  key: postgres-password
            - name: DefenseEngine__Audit__ConnectionString
              value: Host=postgres;Database=defense;Username=defense;Password=$(POSTGRES_PASSWORD)
            - name: DefenseEngine__Consensus__Enabled
              value: "true"
            - name: DefenseEngine__Consensus__ListenAddress
              value: 0.0.0.0
            - name: DefenseEngine__Consensus__AdvertisedHost
              value: $(POD_NAME).edge-gateway-headless.ai-scraping-defense.svc.cluster.local
            - name: DefenseEngine__Consensus__Port
              value: "3262"
            - name: DefenseEngine__Consensus__StoragePath
              value: /app/data/raft
            - name: DefenseEngine__Consensus__SharedSecret
              valueFrom:
                secretKeyRef:
                  name: defense-secrets
                  key: consensus-shared-secret
            - name: DefenseEngine__Consensus__Members__0__RaftEndpoint
              value: edge-gateway-0.edge-gateway-headless.ai-scraping-defense.svc.cluster.local:3262
            - name: DefenseEngine__Consensus__Members__0__ApiBaseUrl
              value: http://edge-gateway-0.edge-gateway-headless.ai-scraping-defense.svc.cluster.local:8080
            - name: DefenseEngine__Consensus__Members__1__RaftEndpoint
              value: edge-gateway-1.edge-gateway-headless.ai-scraping-defense.svc.cluster.local:3262
            - name: DefenseEngine__Consensus__Members__1__ApiBaseUrl
              value: http://edge-gateway-1.edge-gateway-headless.ai-scraping-defense.svc.cluster.local:8080
            - name: DefenseEngine__Consensus__Members__2__RaftEndpoint
              value: edge-gateway-2.edge-gateway-headless.ai-scraping-defense.svc.cluster.local:3262
            - name: DefenseEngine__Consensus__Members__2__ApiBaseUrl
              value: http://edge-gateway-2.edge-gateway-headless.ai-scraping-defense.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: edge-state
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: edge-state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: escalation-engine
  namespace: ai-scraping-defense
spec:
  selector:
    app: escalation-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escalation-engine
  namespace: ai-scraping-defense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: escalation-engine
  template:
    metadata:
      labels:
        app: escalation-engine
        app.kubernetes.io/part-of: ai-scraping-defense
    spec:
      containers:
        - name: escalation-engine
          image: ghcr.io/your-org/ai-scraping-defense-escalation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: DefenseEngine__Redis__ConnectionString
              value: redis:6379
            - name: DefenseEngine__Topology__ServiceToken
              valueFrom:
                secretKeyRef:
                  name: defense-secrets
                  key: split-service-token
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tarpit-api
  namespace: ai-scraping-defense
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: tarpit-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarpit-api
  namespace: ai-scraping-defense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tarpit-api
  template:
    metadata:
      labels:
        app: tarpit-api
        app.kubernetes.io/part-of: ai-scraping-defense
    spec:
      containers:
        - name: tarpit-api
          image: ghcr.io/your-org/ai-scraping-defense-tarpit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ai-scraping-defense
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ai-scraping-defense
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: ai-scraping-defense
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-state
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-scraping-defense
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-scraping-defense
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: ai-scraping-defense
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: defense
            - name: POSTGRES_USER
              value: defense
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: defense-secrets
                  key: postgres-password
          volumeMounts:
            - name: postgres-state
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: raft-only-from-edge-nodes
  namespace: ai-scraping-defense
spec:
  podSelector:
    matchLabels:
      app: edge-gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: edge-gateway
      ports:
        - protocol: TCP
          port: 3262
