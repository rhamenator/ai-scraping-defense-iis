services:
  edge-gateway:
    environment:
      DefenseEngine__Observability__EnablePrometheusEndpoint: "true"
      DefenseEngine__Observability__PrometheusEndpointPath: /metrics
      DefenseEngine__Observability__OtlpEndpoint: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    # No --web.enable-lifecycle: with it, anyone who can reach port 9090 can POST /-/quit to stop Prometheus or /-/reload
    # to reload its configuration, and there is no authentication. Apply a configuration change by restarting the service.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped
    ports:
      # This host only. Prometheus has no authentication; put authenticated TLS and network controls in front of any
      # remote listener instead of publishing this port to other machines.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      edge-gateway:
        condition: service_started
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD to a strong, unique value before starting Grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Local access only. Put authenticated TLS and network controls in front of any remote listener.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      # The edge gateway reaches the collector over the Compose network, so nothing here needs to be reachable from other
      # machines. These are for developer tools on this host only. The receiver has no authentication; for remote
      # producers use deploy/observability/otel-collector-remote.example.yaml (authenticated TLS) instead of opening these.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  grafana-data:
